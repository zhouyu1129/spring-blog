spring.application.name=blog

spring.config.import=classpath:postgres.properties,classpath:redis.properties,classpath:mail.properties

# 前端地址：邮件中的验证/重置链接以前端域名发出（前端将 /api 请求转发给后端），
# 后端处理完成后也重定向回该地址
app.frontend-url=http://localhost:5173

# 上传文件保存目录（数据库 images/files 表的 path 字段只存相对该目录的相对路径，
# 前端通过 /media/images/**、/media/files/** 访问，见 WebMvcConfig）
# 相对路径基于项目运行目录，可改为绝对路径如 E:/blog-upload/images
app.upload.image-dir=./upload/images
app.upload.file-dir=./upload/files

# 上传大小限制（前端限制单文件不超过 100MB）
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=org.example.blog.handler